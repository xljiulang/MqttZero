name: performance

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-performance:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore MqttZero.slnx --locked-mode
      - name: Build
        run: dotnet build MqttZero.slnx -c Release --no-restore
      - name: Strict benchmark
        shell: pwsh
        run: >-
          ./eng/run-broker-benchmark.ps1
          -Client mqttnet
          -OutputPath artifacts/broker-performance-${{ matrix.os }}.json
          -StartPort 30000
          -Qos 0,1,2
          -Subscribers 1,100
          -PayloadSizes 32,8192,65536
          -WarmupSeconds 5
          -MeasurementSeconds 20
          -Repetitions 3
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-performance-${{ matrix.os }}
          path: artifacts/broker-performance-${{ matrix.os }}.json
          if-no-files-found: warn
