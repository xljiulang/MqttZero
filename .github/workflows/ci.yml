name: ci

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  broker:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore MqttZero.slnx --locked-mode
      - name: Build
        run: dotnet build MqttZero.slnx -c Release --no-restore
      - name: Tests and coverage
        shell: pwsh
        run: ./eng/verify-coverage.ps1
      - name: Benchmark tests
        run: dotnet test tests/MqttZero.BrokerBenchmarks.Tests/MqttZero.BrokerBenchmarks.Tests.csproj -c Release --no-build
      - name: Benchmark smoke
        shell: pwsh
        run: ./eng/verify-benchmark-smoke.ps1
      - name: Formatting
        run: dotnet format MqttZero.slnx --verify-no-changes --no-restore
      - name: Vulnerable dependencies
        run: dotnet list MqttZero.slnx package --vulnerable --include-transitive
      - name: Deprecated dependencies
        run: dotnet list MqttZero.slnx package --deprecated

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/MqttZero.Dashboard/package-lock.json
      - name: Install
        working-directory: dashboard/MqttZero.Dashboard
        run: npm ci
      - name: Test
        working-directory: dashboard/MqttZero.Dashboard
        run: npm test
      - name: Audit
        working-directory: dashboard/MqttZero.Dashboard
        run: npm audit --audit-level=high
      - name: Build
        working-directory: dashboard/MqttZero.Dashboard
        run: npm run build
      - name: Verify embedded assets are current
        run: git diff --exit-code -- src/MqttZero.AspNetCore.Dashboard/wwwroot

  packages:
    needs:
      - broker
      - dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore MqttZero.slnx --locked-mode
      - name: Pack and consume NuGet packages
        shell: pwsh
        run: ./eng/verify-packages.ps1
